      /* Critical boot styles: the marigold-curtain opening shows before any JavaScript arrives */
      html { background: #12080a; }
      body { margin: 0; background: #12080a; }
      #boot {
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        background: radial-gradient(120% 85% at 50% 46%, #3a1a12 0%, #1d0c0b 48%, #0a0405 100%);
        transition: opacity 1.1s ease .1s, visibility 1.1s ease .1s;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }
      #boot .bc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      /* behind the curtain: a warm glow and the couple's names */
      #boot .bc-glow {
        position: absolute; left: 50%; top: 48%; width: min(160vw, 1200px); aspect-ratio: 1; transform: translate(-50%, -50%); opacity: 0;
        background: radial-gradient(circle, rgba(255,186,98,.34) 0%, rgba(255,140,60,.13) 28%, rgba(255,120,40,.04) 48%, transparent 66%);
        animation: bc-fade 1.6s ease .9s forwards;
      }
      #boot .bc-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 4vh; }
      #boot .bc-eyebrow { display: block; width: min(56vw, 290px); height: auto; opacity: 0; animation: bc-rise .9s ease 1.25s forwards; }
      #boot .bc-names { display: block; width: min(70vw, 600px); height: auto; margin-top: clamp(12px, 2.4svh, 22px); overflow: visible; }
      #boot .n { fill: url(#bc-ink); fill-opacity: 0; stroke: #f0d9a2; stroke-width: 1.1; stroke-dasharray: 1 1; stroke-dashoffset: 1; stroke-linejoin: round; }
      #boot .n-one { animation: bc-write 1.05s cubic-bezier(.45,.1,.35,1) 1.35s forwards, bc-ink .8s ease 1.9s forwards; }
      #boot .n-amp { animation: bc-write .55s ease 2s forwards, bc-ink .6s ease 2.3s forwards; }
      #boot .n-two { animation: bc-write 1s cubic-bezier(.45,.1,.35,1) 2.15s forwards, bc-ink .8s ease 2.65s forwards; }
      #boot .bc-rule { width: min(40vw, 160px); height: 1px; margin-top: clamp(12px, 2svh, 18px); opacity: 0;

      #boot .bc-date { display: block; width: min(44vw, 220px); height: auto; margin-top: clamp(10px, 1.8svh, 16px); opacity: 0; animation: bc-rise .9s ease 2.85s forwards; }
      /* the curtain: strings of marigold, jasmine and rose hanging from a thoranam, parting from the middle */
      #boot .bc-curtain { position: absolute; inset: 0; pointer-events: none; }
      #boot .strand { position: absolute; top: clamp(14px, 2.4svh, 26px); height: calc(100% + 60px); width: var(--w); margin-left: calc(var(--w) / -2);
        animation: bc-part 1.55s cubic-bezier(.62,.02,.24,1) var(--d) forwards; }
      #boot .strand.front { --w: clamp(20px, 2.5vw, 40px); z-index: 2; }
      #boot .strand.back { --w: clamp(17px, 2.1vw, 34px); z-index: 1; }
      #boot .swing { height: 100%; transform-origin: 50% 0; animation: bc-swing 2.3s ease-out var(--d) both; }
      #boot .str { height: var(--h); transform-origin: 50% 0; background-repeat: repeat-y; background-size: 100% auto;
        animation: bc-sway var(--sw) ease-in-out var(--sd) 2 alternate; }
      #boot .back .str { animation: none; }

    <script>
      /* hang the garland strings across this screen, and work out where each one gathers when the curtain parts */
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]reducedmotion/.test(location.search);
        if (still) boot.classList.add('bc-still');
        var W = window.innerWidth, curtain = boot.querySelector('.bc-curtain'), petals = boot.querySelector('.bc-petals');
        var n = Math.max(16, Math.min(46, Math.round(W / 31)));
        var gather = Math.max(30, Math.min(180, W * 0.1)); // how wide each tied-back bunch is
        var r = Math.random, frag = document.createDocumentFragment();
        function strand(layer, x) {
          var side = x < W / 2 ? -1 : 1;
          var p = side < 0 ? x / (W / 2) : (W - x) / (W / 2); // 0 at the edge, 1 in the middle
          var target = side < 0 ? gather * p : W - gather * p;
          var s = document.createElement('div'), sw = document.createElement('div'), st = document.createElement('div');
          s.className = 'strand ' + layer; sw.className = 'swing'; st.className = 'str t' + Math.floor(r() * 3);
          s.style.left = x.toFixed(1) + 'px';
          s.style.setProperty('--dx', (target - x).toFixed(1) + 'px');
          s.style.setProperty('--s', side);
          s.style.setProperty('--d', (0.75 + (1 - p) * 0.32 + (layer === 'back' ? 0.06 : 0)).toFixed(2) + 's');
          st.style.setProperty('--h', (100 + r() * 9).toFixed(1) + '%');
          st.style.setProperty('--sw', (1.4 + r() * 0.8).toFixed(2) + 's');
          st.style.setProperty('--sd', (-r() * 1.2).toFixed(2) + 's');
          st.style.backgroundPosition = '0 ' + Math.floor(r() * 4) * 25 + '%';
          sw.appendChild(st); s.appendChild(sw); frag.appendChild(s);
        }
        for (var i = 0; i <= n; i++) strand('back', (i / n) * W);
        for (var j = 0; j < n; j++) strand('front', ((j + 0.5) / n) * W);
        curtain.appendChild(frag);
        if (still) return;
        var kinds = ['pr', 'pr', 'pm', 'pm', 'pj'], pf = document.createDocumentFragment();
        for (var k = 0; k < (W < 700 ? 22 : 34); k++) {
          var el = document.createElement('div'), inner = document.createElement('i');
          el.className = 'petal ' + kinds[Math.floor(r() * kinds.length)];
          el.style.left = (18 + r() * 64).toFixed(1) + '%';
          el.style.setProperty('--ps', (11 + r() * 9).toFixed(1) + 'px');
          el.style.setProperty('--px', ((r() - 0.5) * 160).toFixed(0) + 'px');
          el.style.setProperty('--pr', ((r() - 0.5) * 720).toFixed(0) + 'deg');
          el.style.setProperty('--pd', (2.6 + r() * 1.8).toFixed(2) + 's');
          el.style.setProperty('--pdl', (0.85 + r() * 1.5).toFixed(2) + 's');
          inner.style.setProperty('--pf', (1.1 + r() * 1.4).toFixed(2) + 's');
          el.appendChild(inner); pf.appendChild(el);
        }
        petals.appendChild(pf);
      })();
    </script>
